quarkus.native.additional-build-args=--initialize-at-run-time=org.jline.nativ

# IDEA MCP client: the URL has no default on purpose (IDEA picks a free port and
# prints the endpoint via "Copy HTTP Stream Config"). The %test section points
# the app under test at the fake IDEA MCP server launched by
# VintelliIdeaClientTest; the packaged app under @QuarkusIntegrationTest gets
# its URL from the config file wired through QUARKUS_CONFIG_LOCATIONS in the
# failsafe configuration.
%test.vintelli.idea.mcp.url=http://127.0.0.1:8080
%test.vintelli.idea.mcp.auth-token=vintelli-token
