name: Release Perform
run-name: Perform ${{ inputs.tag || inputs.version || github.ref_name }} release

on:
  workflow_call:
    inputs:
      version:
        description: "Released version, without the v prefix, e.g. 0.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Build and checksum the archives as workflow artifacts without creating or changing a GitHub Release"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-perform-${{ inputs.version || inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Validate version is semver
        env:
          TAG: ${{ inputs.version || inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a plain semver version like 0.1.0, got '$TAG'"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version || inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Check the tagged commit is on main
        env:
          TAG: ${{ inputs.version || inputs.tag || github.ref_name }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${TAG} is not on main; release only from commits reachable from main"
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Check tag matches the pom.xml version of the tagged commit
        env:
          TAG: ${{ inputs.version || inputs.tag || github.ref_name }}
        run: |
          POM_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "${POM_VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pom.xml version ${POM_VERSION} of the tagged commit"
            exit 1
          fi
      - id: meta
        env:
          TAG: ${{ inputs.version || inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Native ${{ matrix.os }}
    needs: [verify]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-amd64
            runner: ubuntu-latest
            native_args: "-Dquarkus.native.container-build"
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            native_args: "-Dquarkus.native.container-build"
          - os: darwin-arm64
            runner: macos-latest
            native_args: ""
          - os: windows-amd64
            runner: windows-latest
            native_args: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
      - name: Set up Java 25 (Temurin, Mandrel builds in a container)
        if: ${{ startsWith(matrix.os, 'linux') }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Set up Mandrel 25 (native image toolchain)
        if: ${{ !startsWith(matrix.os, 'linux') }}
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: "25"
          distribution: mandrel
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the foreign ACP agent
        run: |
          npm install -g @opencode/cli@2.1.4
          opencode --version
      - name: Run native integration tests and build the native runner
        env:
          VINTELLI_FOREIGN_ACP_COMMAND: opencode acp
        run: ./mvnw -B -ntp verify -Dnative ${{ matrix.native_args }}
      - name: Package archive (Unix)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          OS_ARCH: ${{ matrix.os }}
        run: |
          RUNNERS=$(find vintelli-app/target -maxdepth 1 -type f \( -name '*-runner' -o -name '*-runner.exe' \))
          if [ "$(printf '%s\n' "$RUNNERS" | grep -c .)" != 1 ]; then
            echo "::error::Expected exactly one native runner in vintelli-app/target, found: ${RUNNERS:-none}"
            exit 1
          fi
          NAME="vintelli-${VERSION}-${OS_ARCH}"
          mkdir -p "dist/${NAME}"
          cp "$RUNNERS" "dist/${NAME}/vintelli"
          cp LICENSE NOTICE README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME}"
      - name: Package archive (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          OS_ARCH: ${{ matrix.os }}
        run: |
          $runners = @(Get-ChildItem -File -Path vintelli-app/target -Filter '*-runner.exe')
          if ($runners.Count -ne 1) { throw "Expected exactly one native runner in vintelli-app/target, found $($runners.Count)" }
          $name = "vintelli-${env:VERSION}-${env:OS_ARCH}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item -Path $runners[0].FullName -Destination "dist/$name/vintelli.exe"
          Copy-Item -Path LICENSE, NOTICE, README.md -Destination "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Path "dist/$name"
      - name: Attest archive provenance (Unix)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attest archive provenance (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.os }}
          path: dist/vintelli-*
          if-no-files-found: error
      - name: Upload native integration test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-it-reports-${{ matrix.os }}
          path: |
            vintelli-app/target/failsafe-reports
            vintelli-app/target/quarkus.log
          if-no-files-found: ignore

  checksums:
    name: SHA256SUMS
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum vintelli-* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, checksums]
    if: ${{ needs.verify.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
