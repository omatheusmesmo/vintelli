name: native-client-bench

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "docs/spikes/spike-47-native-client-bench/**"
      - ".github/workflows/native-client-bench.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

defaults:
  run:
    shell: bash

jobs:
  jvm-validate:
    name: JVM round trip (both clients)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install jbang
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"

      - name: Round trips in spawn mode, five runs each
        working-directory: docs/spikes/spike-47-native-client-bench
        run: |
          {
            echo "### JVM spawn mode (client spawns the JVM echo server), 5 runs"
            echo '```'
            for i in 1 2 3 4 5; do
              java handrolled-minimal-client.java java echo-lsp-server.java 2>&1 | grep 'ok$'
            done
            for i in 1 2 3 4 5; do
              jbang --quiet lsp4j-minimal-client.java java echo-lsp-server.java 2>&1 | grep 'ok$'
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(grep -c 'ok$' "$GITHUB_STEP_SUMMARY")" -ge 10

      - name: Round trips externally piped, five runs each
        working-directory: docs/spikes/spike-47-native-client-bench
        run: |
          piped() {
            rm -f j-in.fifo j-out.fifo && mkfifo j-in.fifo j-out.fifo
            (java echo-lsp-server.java < j-out.fifo > j-in.fifo 2>/dev/null &)
            "$@" > j-out.fifo < j-in.fifo 2> piped.txt
            grep 'ok$' piped.txt
            rm -f j-in.fifo j-out.fifo piped.txt
          }
          {
            echo "### JVM stdio mode (server externally piped), 5 runs"
            echo '```'
            for i in 1 2 3 4 5; do piped java handrolled-minimal-client.java; done
            for i in 1 2 3 4 5; do piped jbang --quiet lsp4j-minimal-client.java; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  native-bench:
    name: Native build and startup bench
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GraalVM Community Edition (JDK 25)
        run: |
          curl -sSL https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.4.4.1.1/graalvm-community-jdk-25i4-25.0.4.1.1_linux-x64_bin.tar.gz | tar -zxf - -C "$HOME"
          GRAAL_HOME=$(echo "$HOME"/graalvm-community-openjdk-25*)
          if [ ! -d "$GRAAL_HOME" ]; then GRAAL_HOME=$(ls -d "$HOME"/graalvm-*/ | head -1); fi
          "$GRAAL_HOME/bin/java" -version
          echo "$GRAAL_HOME/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$GRAAL_HOME" >> "$GITHUB_ENV"

      - name: Install jbang
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          echo "$HOME/.jbang/bin" >> "$GITHUB_PATH"

      - name: Hand-rolled native build
        working-directory: docs/spikes/spike-47-native-client-bench
        run: |
          mkdir -p build
          javac -d build handrolled-minimal-client.java echo-lsp-server.java
          BEGIN=$SECONDS
          native-image --no-fallback -cp build HandrolledJsonRpcClient -o handrolled-native
          echo "HANDROLLED_BUILD_S=$((SECONDS-BEGIN))" >> "$GITHUB_ENV"
          stat -c %s handrolled-native > handrolled-native.size

      - name: LSP4J reachability metadata via tracing agent
        working-directory: docs/spikes/spike-47-native-client-bench
        run: |
          rm -rf agent-config
          jbang --quiet --runtime-option=-agentlib:native-image-agent=config-output-dir=agent-config lsp4j-minimal-client.java java echo-lsp-server.java
          python3 -c "
          import json
          meta = json.load(open('agent-config/reachability-metadata.json'))
          entries = meta.get('reflection', [])
          classes = [e['type'] for e in entries if isinstance(e.get('type'), str)]
          proxies = [e['type']['proxy'] for e in entries if isinstance(e.get('type'), dict) and 'proxy' in e['type']]
          print('AGENT_REFLECTION_TOTAL=%d' % len(entries))
          print('AGENT_REFLECTION_CLASSES=%d' % len(classes))
          print('AGENT_REFLECTION_LSP4J=%d' % len([t for t in classes if 'org.eclipse.lsp4j' in t]))
          print('AGENT_REFLECTION_GSON=%d' % len([t for t in classes if 'com.google.gson' in t]))
          print('AGENT_PROXY=%d' % len(proxies))
          print('AGENT_RESOURCES=%d' % len(meta.get('resources', [])))
          for p in proxies:
              print('proxy set: ' + ' + '.join(p), file=__import__('sys').stderr)
          " >> "$GITHUB_ENV"

      - name: LSP4J native build (tracing agent config)
        working-directory: docs/spikes/spike-47-native-client-bench
        run: |
          CP=$(jbang info classpath lsp4j-minimal-client.java)
          mkdir -p cfg/META-INF/native-image/org.eclipse.lsp4j/lsp4j
          python3 -c "
          import json
          meta = json.load(open('agent-config/reachability-metadata.json'))
          def wanted(name):
              return name.startswith('org.eclipse.') or name.startswith('com.google.gson')
          def keep(e):
              t = e.get('type')
              if isinstance(t, dict):
                  return all(wanted(i) for i in t.get('proxy', []))
              return isinstance(t, str) and wanted(t)
          meta['reflection'] = [e for e in meta.get('reflection', []) if keep(e)]
          json.dump(meta, open('cfg/META-INF/native-image/org.eclipse.lsp4j/lsp4j/reachability-metadata.json', 'w'), indent=2)
          entries = meta['reflection']
          print('AGENT_CFG_KEPT=%d' % len(entries))
          print('AGENT_CFG_KEPT_PROXY=%d' % len([e for e in entries if isinstance(e.get('type'), dict)]))
          " >> "$GITHUB_ENV"
          BEGIN=$SECONDS
          native-image --no-fallback -cp "cfg:$CP" Lsp4jMinimalClient -o lsp4j-native-agentcfg
          echo "LSP4J_AGENT_BUILD_S=$((SECONDS-BEGIN))" >> "$GITHUB_ENV"
          stat -c %s lsp4j-native-agentcfg > lsp4j-native-agentcfg.size

      - name: LSP4J native build (blanket sweep config)
        working-directory: docs/spikes/spike-47-native-client-bench
        run: |
          CP=$(jbang info classpath lsp4j-minimal-client.java)
          LSP4J_CORE=$(echo "$CP" | tr ':' '\n' | grep 'org.eclipse.lsp4j-[0-9]')
          LSP4J_JSONRPC=$(echo "$CP" | tr ':' '\n' | grep 'org.eclipse.lsp4j.jsonrpc-[0-9]')
          mkdir -p blanket-cfg/META-INF/native-image/org.eclipse.lsp4j/lsp4j
          python3 - blanket-cfg/META-INF/native-image/org.eclipse.lsp4j/lsp4j/reachability-metadata.json "$LSP4J_CORE" "$LSP4J_JSONRPC" >> "$GITHUB_ENV" <<'PY'
          import json
          import sys
          import zipfile

          out_path, jars = sys.argv[1], sys.argv[2:]
          services = ["LanguageServer", "LanguageClient", "TextDocumentService",
                      "WorkspaceService", "NotebookDocumentService"]
          entries = []
          for jar in jars:
              with zipfile.ZipFile(jar) as z:
                  names = sorted(n for n in z.namelist()
                                 if n.endswith(".class")
                                 and not n.startswith("META-INF/")
                                 and not n.endswith("module-info.class"))
              for n in names:
                  entries.append({
                      "type": n[:-6].replace("/", "."),
                      "allDeclaredConstructors": True,
                      "allDeclaredMethods": True,
                      "allDeclaredFields": True,
                  })
          classes = len(entries)
          for service in services:
              entries.append({"type": {"proxy": [
                  "org.eclipse.lsp4j.services." + service,
                  "org.eclipse.lsp4j.jsonrpc.Endpoint"]}})
          json.dump({"reflection": entries}, open(out_path, "w"), indent=2)
          print("BLANKET_REFLECTION_CLASSES=%d" % classes)
          print("BLANKET_REFLECTION_PROXY=%d" % len(services))
          PY
          BEGIN=$SECONDS
          native-image --no-fallback -cp "blanket-cfg:$CP" Lsp4jMinimalClient -o lsp4j-native-blanket
          echo "LSP4J_BLANKET_BUILD_S=$((SECONDS-BEGIN))" >> "$GITHUB_ENV"
          stat -c %s lsp4j-native-blanket > lsp4j-native-blanket.size

      - name: Startup bench, five runs each against the compiled echo server
        working-directory: docs/spikes/spike-47-native-client-bench
        run: |
          bench() {
            echo "### $2" >> "$GITHUB_STEP_SUMMARY"
            : > "$3"
            for i in 1 2 3 4 5; do
              rm -f n-in.fifo n-out.fifo && mkfifo n-in.fifo n-out.fifo
              (java -cp build EchoLspServer < n-out.fifo > n-in.fifo 2>/dev/null &)
              RC=0
              T0=$(date +%s%N)
              timeout 30 "$1" > n-out.fifo < n-in.fifo 2> "$3.one" || RC=$?
              T1=$(date +%s%N)
              {
                echo "run_$i wall_ms=$(( (T1 - T0) / 1000000 )) exit_rc=$RC"
                cat "$3.one"
              } >> "$3"
              rm -f n-in.fifo n-out.fifo "$3.one"
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$3" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          bench ./handrolled-native handrolled handrolled-bench.txt
          bench ./lsp4j-native-agentcfg lsp4j-agentcfg lsp4j-agentcfg-bench.txt
          bench ./lsp4j-native-blanket lsp4j-blanket lsp4j-blanket-bench.txt
          for f in handrolled-bench.txt lsp4j-agentcfg-bench.txt lsp4j-blanket-bench.txt; do
            echo "$f: $(grep -c 'ok$' "$f") of 5 sessions completed" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          test "$(grep -c 'exit_rc=0' handrolled-bench.txt)" = 5
          test "$(grep -c 'ok$' handrolled-bench.txt)" = 5

      - name: Quarkus LSP4J native image (container build, no extra config)
        working-directory: docs/spikes/spike-47-native-client-bench/lsp4j-quarkus-minimal
        run: |
          cat > "$RUNNER_TEMP/quarkus-run.sh" <<'SH'
          quarkus_run() {
            echo "### $1" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            for i in $(seq 1 "$2"); do
              rm -f q-in.fifo q-out.fifo && mkfifo q-in.fifo q-out.fifo
              (java -cp ../build EchoLspServer < q-out.fifo > q-in.fifo 2>/dev/null &)
              RC=0
              T0=$(date +%s%N)
              QUARKUS_LOG_CONSOLE_STDERR=true timeout 30 ./target/*-runner > q-out.fifo < q-in.fifo 2> quarkus-bench.txt || RC=$?
              T1=$(date +%s%N)
              {
                echo "run_$i wall_ms=$(( (T1 - T0) / 1000000 )) exit_rc=$RC"
                head -c 6000 quarkus-bench.txt
              } | tee -a "$GITHUB_STEP_SUMMARY"
              rm -f q-in.fifo q-out.fifo
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          SH
          . "$RUNNER_TEMP/quarkus-run.sh"
          BEGIN=$SECONDS
          "$GITHUB_WORKSPACE/mvnw" -B -ntp -f pom.xml package -Dnative -Dquarkus.native.container-build -DskipTests
          echo "QUARKUS_BUILD_S=$((SECONDS-BEGIN))" >> "$GITHUB_ENV"
          echo "QUARKUS_RUNNER_BYTES=$(stat -c %s target/*-runner)" >> "$GITHUB_ENV"
          quarkus_run 'Quarkus native runner, no reflection config, console log on stderr' 1

      - name: Quarkus LSP4J native image (container build, tracing agent config)
        working-directory: docs/spikes/spike-47-native-client-bench/lsp4j-quarkus-minimal
        run: |
          . "$RUNNER_TEMP/quarkus-run.sh"
          mkdir -p src/main/resources/META-INF/native-image/org.eclipse.lsp4j/lsp4j
          cp ../cfg/META-INF/native-image/org.eclipse.lsp4j/lsp4j/reachability-metadata.json src/main/resources/META-INF/native-image/org.eclipse.lsp4j/lsp4j/
          BEGIN=$SECONDS
          "$GITHUB_WORKSPACE/mvnw" -B -ntp -f pom.xml clean package -Dnative -Dquarkus.native.container-build -DskipTests
          echo "QUARKUS_CFG_BUILD_S=$((SECONDS-BEGIN))" >> "$GITHUB_ENV"
          echo "QUARKUS_CFG_RUNNER_BYTES=$(stat -c %s target/*-runner)" >> "$GITHUB_ENV"
          quarkus_run 'Quarkus native runner, tracing agent config (181 entries), console log on stderr' 5

      - name: Collect bench results artifact
        working-directory: docs/spikes/spike-47-native-client-bench
        if: always()
        run: |
          {
            cat handrolled-bench.txt
            cat lsp4j-agentcfg-bench.txt
            cat lsp4j-blanket-bench.txt
          } | tee bench-results.md
          {
            printf '%s\n' '## Artifact sizes measured this run'
            stat -c '%s %n' handrolled-native lsp4j-native-agentcfg lsp4j-native-blanket lsp4j-quarkus-minimal/target/*-runner 2>/dev/null || true
          } | tee -a bench-results.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-47-bench-results
          path: |
            docs/spikes/spike-47-native-client-bench/bench-results.md
            docs/spikes/spike-47-native-client-bench/agent-config
            docs/spikes/spike-47-native-client-bench/cfg
            docs/spikes/spike-47-native-client-bench/blanket-cfg

      - name: Report artifacts and metadata facts
        working-directory: docs/spikes/spike-47-native-client-bench
        if: always()
        run: |
          {
            printf '%s\n' ''
            printf '%s\n' '## Build facts'
            printf '%s\n' ''
            printf '%s\n' '| item | value |'
            printf '%s\n' '|---|---|'
            printf '| handrolled native build s | %s |\n' "${HANDROLLED_BUILD_S:-missing}"
            printf '| lsp4j native build s (agent config) | %s |\n' "${LSP4J_AGENT_BUILD_S:-missing}"
            printf '| lsp4j native build s (blanket config) | %s |\n' "${LSP4J_BLANKET_BUILD_S:-missing}"
            printf '| agent reflection entries total | %s |\n' "${AGENT_REFLECTION_TOTAL:-missing}"
            printf '| agent class entries | %s |\n' "${AGENT_REFLECTION_CLASSES:-missing}"
            printf '| agent class entries lsp4j | %s |\n' "${AGENT_REFLECTION_LSP4J:-missing}"
            printf '| agent class entries gson | %s |\n' "${AGENT_REFLECTION_GSON:-missing}"
            printf '| agent proxy entries | %s |\n' "${AGENT_PROXY:-missing}"
            printf '| agent resource entries | %s |\n' "${AGENT_RESOURCES:-missing}"
            printf '| agent config entries kept after filter | %s |\n' "${AGENT_CFG_KEPT:-missing}"
            printf '| agent config proxy entries kept | %s |\n' "${AGENT_CFG_KEPT_PROXY:-missing}"
            printf '| blanket class entries | %s |\n' "${BLANKET_REFLECTION_CLASSES:-missing}"
            printf '| blanket proxy entries | %s |\n' "${BLANKET_REFLECTION_PROXY:-missing}"
            printf '| lsp4j-quarkus runner bytes | %s |\n' "${QUARKUS_RUNNER_BYTES:-missing}"
            printf '| lsp4j-quarkus build s | %s |\n' "${QUARKUS_BUILD_S:-missing}"
            printf '| lsp4j-quarkus runner bytes (agent config) | %s |\n' "${QUARKUS_CFG_RUNNER_BYTES:-missing}"
            printf '| lsp4j-quarkus build s (agent config) | %s |\n' "${QUARKUS_CFG_BUILD_S:-missing}"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf '%s\n' ''
            printf '%s\n' '## Standalone image sizes (bytes)'
            printf '%s\n' ''
            printf '%s\n' '| image | bytes |'
            printf '%s\n' '|---|---|'
            for f in handrolled-native.size lsp4j-native-agentcfg.size lsp4j-native-blanket.size; do
              if [ -f "$f" ]; then printf '| %s | %s |\n' "$f" "$(cat "$f")"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
