name: Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/**'
      - 'vintelli-tui/src/main/resources/dev/omatheusmesmo/vintelli/tui/themes/**'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'vintelli-tui/src/main/resources/dev/omatheusmesmo/vintelli/tui/themes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '25'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the project site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install tmux for the screen capture
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends tmux
          fi
          tmux -V

      - name: Package the app runner the capture starts
        run: ./mvnw -B -ntp -pl vintelli-app -am package -DskipTests

      - name: Capture the TUI screens
        run: bash site/capture/capture.sh vintelli-app/target/quarkus-app/quarkus-run.jar

      - name: Check captures, placeholders and spike links
        run: bash site/check.sh

      - name: Build the Roq site
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: 'true'
        run: ./mvnw -B -ntp -f site/pom.xml package quarkus:run

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/target/roq

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
