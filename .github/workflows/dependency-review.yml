name: Dependency review

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Merge queue entry (dependency review already ran on the pull request)
        if: github.event_name == 'merge_group'
        run: |
          echo "Merge group entry: the dependency review was already evaluated on the pull_request event."

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            Unlicense, Zlib, EPL-1.0, EPL-2.0, MPL-2.0,
            LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later,
            GPL-2.0-only WITH Classpath-exception-2.0,
            GPL-2.0-or-later WITH Classpath-exception-2.0,
            CDDL-1.0, CDDL-1.1, UPL-1.0, CC0-1.0
          # The published lsp4j.debug 1.0.0 POM declares EPL-2.0; GitHub reports NOASSERTION.
          # The published commonmark 0.28.0 POM declares BSD-2-Clause; GitHub adds
          # BSD-3-Clause-No-Nuclear-Warranty. It already ships through tamboui-markdown.
          # The fonttools 4.60.1 wheel declares MIT; GitHub adds the licenses of the
          # third-party code listed in its LICENSE.external. Only the site build uses it.
          allow-dependencies-licenses: >-
            pkg:maven/io.quarkus.platform/quarkus-bom,
            pkg:maven/io.quarkus.platform/quarkus-maven-plugin,
            pkg:maven/io.netty/netty-bom,
            pkg:maven/org.jline/jline,
            pkg:maven/org.eclipse.lsp4j/org.eclipse.lsp4j.debug@1.0.0,
            pkg:maven/org.commonmark/commonmark@0.28.0,
            pkg:pypi/fonttools@4.60.1
          comment-summary-in-pr: on-failure
