name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  test-jvm:
    name: Test (JVM) ${{ matrix.os }}
    needs: changes
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests and package
        run: ./mvnw -B -ntp -T 1C verify

  build-native:
    name: Native image (Mandrel container)
    needs: changes
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (${{ env.JAVA_VERSION }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install the foreign ACP agent
        run: |
          npm install -g @opencode/cli@2.1.4
          opencode --version

      - name: Build native image and run integration tests against it
        env:
          VINTELLI_FOREIGN_ACP_COMMAND: opencode acp
        run: ./mvnw -B -ntp verify -Dnative -Dquarkus.native.container-build

      - name: Upload native integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-it-reports
          path: |
            vintelli-app/target/failsafe-reports
            vintelli-app/target/quarkus.log

      - name: Smoke test native runner
        run: |
          RUNNER=$(find vintelli-app/target -maxdepth 1 -type f -name '*-runner*' | head -1)
          "$RUNNER" &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "native runner exited too early" >&2
            exit 1
          fi
          kill "$PID"
          echo "native runner alive after 10s"

  gate:
    name: CI gate
    if: always()
    needs: [changes, test-jvm, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-jvm, build-native
