name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

defaults:
  run:
    shell: bash

jobs:
  discover-tests:
    name: Discover test shards
    runs-on: ubuntu-latest
    outputs:
      classes: ${{ steps.list.outputs.classes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List test classes
        id: list
        run: |
          TESTS=$(find src/test/java -name '*Test.java' \
            | sed -e 's#src/test/java/##' -e 's#\.java$##' -e 's#/#.#g' | sort)
          if [ -z "$TESTS" ]; then
            JSON='[]'
          else
            JSON=$(printf '%s\n' "$TESTS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "classes=$JSON" >> "$GITHUB_OUTPUT"

  test-jvm:
    name: "Test (JVM) ${{ matrix.os }} ${{ matrix.test }}"
    needs: discover-tests
    if: needs.discover-tests.outputs.classes != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        test: ${{ fromJson(needs.discover-tests.outputs.classes) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Test ${{ matrix.test }}
        run: ./mvnw -B -ntp -T 1C test -Dtest='${{ matrix.test }}' -DfailIfNoTests=false

  package-jvm:
    name: Package (JVM) ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package
        run: ./mvnw -B -ntp -T 1C package -DskipTests

  build-native:
    name: Native image (Mandrel container)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (${{ env.JAVA_VERSION }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build native image (in the Mandrel container, langchain4j pattern)
        run: >
          ./mvnw -B -ntp package -Dnative -DskipTests -Dquarkus.native.container-build
          "-Dquarkus.native.additional-build-args=--initialize-at-run-time=org.jline.nativ"

      - name: Smoke test native runner
        run: |
          RUNNER=$(find target -maxdepth 1 -type f -name '*-runner*' | head -1)
          "$RUNNER" &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "native runner exited too early" >&2
            exit 1
          fi
          kill "$PID"
          echo "native runner alive after 10s"
