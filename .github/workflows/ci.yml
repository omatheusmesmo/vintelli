name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - docs/**
      - '**.md'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

defaults:
  run:
    shell: bash

jobs:
  test-jvm:
    name: Test (JVM) ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests and package
        run: ./mvnw -B -ntp -T 1C verify

  build-native:
    name: Native image (Mandrel container)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (${{ env.JAVA_VERSION }})
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install the foreign ACP agent
        run: |
          npm install -g @opencode/cli@2.1.4
          opencode --version

      - name: Build native image and run integration tests against it
        env:
          VINTELLI_FOREIGN_ACP_COMMAND: opencode acp
        run: ./mvnw -B -ntp verify -Dnative -Dquarkus.native.container-build

      - name: Upload native integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-it-reports
          path: |
            vintelli-app/target/failsafe-reports
            vintelli-app/target/quarkus.log

      - name: Smoke test native runner
        run: |
          RUNNER=$(find vintelli-app/target -maxdepth 1 -type f -name '*-runner*' | head -1)
          "$RUNNER" &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "native runner exited too early" >&2
            exit 1
          fi
          kill "$PID"
          echo "native runner alive after 10s"
