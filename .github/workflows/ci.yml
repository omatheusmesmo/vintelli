name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  test-jvm:
    name: Test (JVM) ${{ matrix.os }}
    needs: changes
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests and package
        run: ./mvnw -B -ntp -T 1C verify

      - name: Smoke test Unix installer (install.sh)
        if: runner.os != 'Windows'
        run: |
          bash ./scripts/test-install.sh
          VINTELLI_REUSE_EXISTING_BUILD=true bash ./scripts/install.sh --source . --force
          "$HOME/.local/bin/vintelli" --version
          "$HOME/.local/bin/vintelli" --help

      - name: Smoke test Windows installer (install.ps1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-install.ps1
          $env:VINTELLI_REUSE_EXISTING_BUILD = 'true'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install.ps1 --source . --force
          & "$env:LOCALAPPDATA\vintelli\vintelli.exe" --version
          & "$env:LOCALAPPDATA\vintelli\vintelli.exe" --help

  build-native:
    name: Native image (Mandrel container)
    needs: changes
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java (${{ env.JAVA_VERSION }})
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Install the foreign ACP agent
        run: |
          npm install -g @opencode/cli@2.1.4
          opencode --version

      - name: Build native image and run integration tests against it
        env:
          VINTELLI_FOREIGN_ACP_COMMAND: opencode acp
        run: ./mvnw -B -ntp verify -Dnative -Dquarkus.native.container-build

      - name: Upload native integration test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-it-reports
          path: |
            vintelli-app/target/failsafe-reports
            vintelli-app/target/quarkus.log

      - name: Smoke test native runner
        run: |
          RUNNER=$(find vintelli-app/target -maxdepth 1 -type f -name '*-runner*' | head -1)
          "$RUNNER" serve &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "native runner exited too early" >&2
            exit 1
          fi
          kill "$PID"
          echo "native runner alive after 10s"

      - name: Smoke test native install via install.sh
        run: |
          FAKE_NATIVE_DIR="$(mktemp -d)"
          printf '#!/usr/bin/env bash\nexit 0\n' > "${FAKE_NATIVE_DIR}/native-image"
          chmod 0755 "${FAKE_NATIVE_DIR}/native-image"
          PATH="${FAKE_NATIVE_DIR}:$PATH" VINTELLI_BUILD_MODE=native VINTELLI_REUSE_EXISTING_BUILD=true bash ./scripts/install.sh --source . --force
          rm -rf "$FAKE_NATIVE_DIR"
          "$HOME/.local/bin/vintelli" --version
          "$HOME/.local/bin/vintelli" --help

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          if ! printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict --status; then
            echo "::error title=actionlint checksum::$archive does not match the SHA-256 pinned in ci.yml"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint

  gate:
    name: CI gate
    if: always()
    needs: [changes, test-jvm, build-native, actionlint]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-jvm, build-native
