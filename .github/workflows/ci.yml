name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-jvm:
    name: Build and test (JVM, Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

  build-native:
    name: Build native image (Mandrel 25)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mandrel (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: mandrel
          java-version: '25'
          cache: maven

      - name: Build native image
        run: ./mvnw -B -ntp package -Dnative -DskipTests

      - name: Smoke test native runner
        run: |
          RUNNER=$(ls target/*-runner | head -1)
          "$RUNNER" &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "native runner exited too early" >&2
            exit 1
          fi
          kill "$PID"
          echo "native runner alive after 10s"
