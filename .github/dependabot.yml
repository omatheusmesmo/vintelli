version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      quarkus:
        patterns:
          - io.quarkus*
          - io.quarkiverse*
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
