# File type icon mapping of the Vintelli TUI, loaded by
# dev.omatheusmesmo.vintelli.tui.icons.FileIcons; the mapping is data, not code.
#
# Key grammar (case-insensitive, matched in lowercase):
#   default.file.<field>      the icon for files nothing else matches
#   default.folder.<field>    the icon for folders nothing else matches
#   name.<file name>.<field>  exact file or folder name, for example
#                             name.pom.xml.glyph for build files
#   ext.<extension>.<field>   extension after the last dot, for example
#                             ext.java.glyph
# Fields per entry: glyph (Nerd Font v3 codepoint), ascii (pure ASCII fallback
# marker) and color (optional #RRGGBB, or an ANSI name: black, red, green,
# yellow, blue, magenta, cyan, white, gray, dark-gray, light-red, light-green,
# light-yellow, light-blue, light-magenta, light-cyan, bright-white). The
# built-in colors are fixed #RRGGBB values close to the IntelliJ file type
# icons, so they look the same in every terminal theme; an ANSI name is painted
# with the palette of the terminal instead. The ASCII face prints colors only.
# Every built-in entry defines all three fields so the ASCII face stays
# distinguishable and the two faces render the same single-cell width.
# A user file <config>/vintelli/file-icons.properties (or the whole path in the
# vintelli.icons.file property) is layered on top with the same key grammar.
#
# Terminals without a patched font show private use area glyphs as tofu boxes,
# blanks or overlapping characters whose advance width varies per terminal:
# they get the ASCII face through vintelli.icons=auto or =ascii (docs/file-icons.md).

# Defaults
default.file.glyph=\uF15B
default.file.ascii=*
default.file.color=#8C8C8C
default.folder.glyph=\uE5FF
default.folder.ascii=/
default.folder.color=#7FA3CC

