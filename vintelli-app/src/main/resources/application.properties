quarkus.http.cors.enabled=true
quarkus.http.host=127.0.0.1
quarkus.mcp.server.http.dns-rebinding-check.enabled=false
quarkus.http.host-validation.require-localhost=false
quarkus.http.auth.basic=true
quarkus.http.auth.proactive=false
quarkus.security.users.embedded.enabled=true
quarkus.websockets-next.server.max-message-size=1048576
quarkus.native.additional-build-args=--initialize-at-run-time=org.jline.nativ
quarkus.native.resources.includes=dev/omatheusmesmo/vintelli/tui/icons/*.properties

%test.vintelli.config.dir=target/test-config-empty
