quarkus.native.additional-build-args=--initialize-at-run-time=org.jline.nativ

# Capability provider ranking for the registry behind the ports in
# vintelli-api. One comma separated identifier list per capability: providers
# are ranked in this order, the first healthy one serves, and unlisted ones
# follow sorted by identifier. Nothing is wired yet, so the values are
# examples; a key naming a capability that does not exist fails the startup.
# vintelli.capabilities.run.provider-order=local,idea
# vintelli.capabilities.terminal.provider-order=local,idea
# vintelli.capabilities.read-file.provider-order=local,idea
# vintelli.capabilities.diagnostics.provider-order=jdtls,idea
# vintelli.capabilities.call-hierarchy.provider-order=jdtls,idea
