quarkus.banner.enabled=false
quarkus.http.cors.enabled=true
quarkus.http.host=127.0.0.1
quarkus.mcp.server.http.dns-rebinding-check.enabled=false
quarkus.http.host-validation.require-localhost=false
quarkus.http.auth.basic=true
quarkus.http.auth.proactive=false
quarkus.security.users.embedded.enabled=true
quarkus.websockets-next.server.max-message-size=1048576
quarkus.class-loading.parent-first-artifacts=org.apache.maven.resolver:maven-resolver-supplier,org.apache.maven.resolver:maven-resolver-api,org.apache.maven.resolver:maven-resolver-util,org.apache.maven.resolver:maven-resolver-spi,org.apache.maven.resolver:maven-resolver-named-locks,org.apache.maven.resolver:maven-resolver-impl,org.apache.maven.resolver:maven-resolver-connector-basic,org.apache.maven.resolver:maven-resolver-transport-file,org.apache.maven.resolver:maven-resolver-transport-http,org.apache.maven:maven-model,org.apache.maven:maven-model-builder,org.apache.maven:maven-resolver-provider,org.apache.maven:maven-artifact,org.apache.maven:maven-repository-metadata,org.apache.maven:maven-builder-support,org.slf4j:slf4j-api,org.codehaus.plexus:plexus-interpolation,org.codehaus.plexus:plexus-utils
quarkus.native.additional-build-args=--initialize-at-run-time=org.jline.nativ\\,com.pty4j.unix.Pty\\,org.jline.terminal.impl.ffm,-H:+SharedArenaSupport
quarkus.native.resources.includes=dev/omatheusmesmo/vintelli/tui/icons/*.properties,dev/omatheusmesmo/vintelli/tui/keymap/*.csv,web-terminal/*

%test.vintelli.config.dir=target/test-config-empty

vintelli.acp.agents.opencode.name=OpenCode
vintelli.acp.agents.opencode.command=opencode
vintelli.acp.agents.opencode.args=acp
vintelli.acp.agents.claude.name=Claude Code
vintelli.acp.agents.claude.command=claude-agent-acp
vintelli.acp.agents.pi.name=pi
vintelli.acp.agents.pi.command=pi-acp
