quarkus.banner.enabled=false
quarkus.http.cors.enabled=true
quarkus.http.host=127.0.0.1
quarkus.mcp.server.http.dns-rebinding-check.enabled=false
quarkus.http.host-validation.require-localhost=false
quarkus.http.auth.basic=true
quarkus.http.auth.proactive=false
quarkus.security.users.embedded.enabled=true
quarkus.websockets-next.server.max-message-size=1048576
quarkus.native.additional-build-args=--initialize-at-run-time=org.jline.nativ\\,com.pty4j.unix.Pty\\,org.jline.terminal.impl.ffm,-H:+SharedArenaSupport
quarkus.native.resources.includes=dev/omatheusmesmo/vintelli/tui/icons/*.properties,dev/omatheusmesmo/vintelli/tui/keymap/*.csv,web-terminal/*

%test.vintelli.config.dir=target/test-config-empty

vintelli.acp.agents.opencode.name=OpenCode
vintelli.acp.agents.opencode.command=opencode
vintelli.acp.agents.opencode.args=acp
vintelli.acp.agents.claude.name=Claude Code
vintelli.acp.agents.claude.command=claude-agent-acp
vintelli.acp.agents.pi.name=pi
vintelli.acp.agents.pi.command=pi-acp
